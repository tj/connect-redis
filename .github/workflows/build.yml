name: build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    name: Node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: sudo apt-get install -y redis-server
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bunx --no-install tsc dist/connect-redis.d.ts --ignoreConfig --noEmit --module nodenext
      - run: bun run test
      - run: node --input-type=module -e 'import {RedisStore} from "connect-redis"; if (typeof RedisStore !== "function") process.exit(1)'
